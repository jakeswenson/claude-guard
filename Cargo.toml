[package]
name = "claude-guard"
version = "0.1.0"
edition = "2024"
description = "A Claude Code hook that denies tool calls that break house rules, says why, and logs every decision"
repository = "https://github.com/jakeswenson/claude-guard"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["claude-code", "hooks", "policy", "guardrails", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
brush-parser = "0.4.0"
color-eyre = "0.6.5"
jiff = { version = "0.2.35", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_repr = "0.1.21"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
temp-env = "0.3.6"
tempfile = "3.27.0"
